<svg xmlns="http://www.w3.org/2000/svg" width="812" height="448" viewBox="0 0 812 448" role="img" aria-label="Beispieldialog: Claude beantwortet eine Frage über die Kamera-Tools">
<style>
text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 14px; fill: #d4d4d4; }
.prompt { fill: #ffffff; font-weight: bold; }
.tool { fill: #7fd88f; }
.result { fill: #8a8a8a; }
.answer { fill: #e6e6e6; }
.title { fill: #9a9a9a; font-size: 12px; }
</style>
<rect width="100%" height="100%" rx="8" fill="#1e1e1e"/>
<circle cx="20" cy="20" r="6" fill="#ff5f56"/><circle cx="38" cy="20" r="6" fill="#ffbd2e"/><circle cx="56" cy="20" r="6" fill="#27c93f"/>
<text x="76" y="24" class="title">Claude Code · camera-mcp (echter Lauf, Antwort ungekürzt)</text>
<text x="20" y="63" class="prompt" xml:space="preserve">&gt; Liegt auf dem Schreibtisch-Standbild die Maus auf dem Mauspad?</text>
<text x="20" y="83" class="plain" xml:space="preserve"></text>
<text x="20" y="103" class="tool" xml:space="preserve">● get_camera_info()</text>
<text x="20" y="123" class="result" xml:space="preserve">  ⎿ 6 Kameras, 5 online</text>
<text x="20" y="143" class="tool" xml:space="preserve">● count_in_zone(camera_id="desk_still", zone="mauspad", classes=["mouse"])</text>
<text x="20" y="163" class="result" xml:space="preserve">  ⎿ counts={"mouse": 1} | mouse 0.90 in mauspad</text>
<text x="20" y="183" class="tool" xml:space="preserve">● detect_objects(camera_id="desk_still")</text>
<text x="20" y="203" class="result" xml:space="preserve">  ⎿ counts={"mouse": 1, "keyboard": 1, "tv": 1}, 21.3 ms | mouse 0.90 in mauspad, keyboard</text>
<text x="20" y="223" class="result" xml:space="preserve">    0.88 in tastatur, tv 0.50 in monitor</text>
<text x="20" y="243" class="plain" xml:space="preserve"></text>
<text x="20" y="263" class="answer" xml:space="preserve">Ja, die Maus liegt auf dem Mauspad.</text>
<text x="20" y="283" class="answer" xml:space="preserve"></text>
<text x="20" y="303" class="answer" xml:space="preserve">Die Objekterkennung hat auf dem Schreibtisch-Standbild genau eine Maus gefunden, mit 90 %</text>
<text x="20" y="323" class="answer" xml:space="preserve">Sicherheit. Ihr Fußpunkt, also die Mitte der Unterkante des Rahmens um die Maus, liegt in</text>
<text x="20" y="343" class="answer" xml:space="preserve">der Zone „mauspad“. Die Maus ist etwa in der Mitte unten im Bild, rechts neben der Tastatur.</text>
<text x="20" y="363" class="answer" xml:space="preserve"></text>
<text x="20" y="383" class="answer" xml:space="preserve">Die Zone „mauspad“ ist ein fest eingestellter Bildbereich. Das Mauspad selbst wird nicht</text>
<text x="20" y="403" class="answer" xml:space="preserve">erkannt. Wenn es verschoben wurde, kann das Ergebnis also falsch sein. Ich habe das Bild</text>
<text x="20" y="423" class="answer" xml:space="preserve">nicht selbst angesehen. Wenn Sie wollen, prüfe ich das.</text>
</svg>
